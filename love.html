<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>💖</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding-top: 100px;
      margin: 0;
      position: relative;
      z-index: 1;

      /* ตัวหนังสืออ่านง่าย */
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
    }

    /* 🌫 พื้นหลังเต็มจอ (ไม่ล้นแบบน่าเกลียด) */
    body::before {
      content: "";
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: url('BG2.jpg') no-repeat center center;
      background-size: cover;   /* 👈 เต็มจอ */
      background-position: center; /* 👈 จัดตำแหน่งกลาง */

      opacity: 0.3; /* 👈 ปรับความจาง */
      z-index: -1;
    }

    h1 {
      font-size: 60px;
      animation: pop 0.6s ease;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    video {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<h1>💖</h1>
<h2>ขอบคุณสำหรับทุกๆอย่างนะเธอ :)</h2>

<video width="500" autoplay muted controls>
  <source src="eyefluke.mp4" type="video/mp4">
</video>
<p>*ปล. ดู VDO จบแล้ว มาจุ้บอายด้วยย อิอิ 😘</p>

</body>
</html>
