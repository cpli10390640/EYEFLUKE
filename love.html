<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>💖</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding-top: 100px;
      margin: 0;
      position: relative;
      z-index: 1;
      color: black;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: url('BG2.jpg') no-repeat center center;
      background-size: cover;
      background-position: center;

      opacity: 0.3;
      z-index: -2;
    }

    h1 {
      font-size: 60px;
      animation: pop 0.6s ease;
    }

    h2 {
      animation: pop 0.8s ease;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
      animation: pop 1s ease;
    }

    video {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      animation: pop 1.2s ease;
    } 

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .heart {
      position: fixed;
      bottom: -30px;
      font-size: 24px;
      animation: floatUp 5s linear forwards;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.8);
        opacity: 0;
      }
    }
  </style>
</head>

<h2>ขอบคุณสำหรับทุกๆอย่างนะเธออ :)</h2>

<video width="500" autoplay muted controls>

<p>*ปล. ดู VDO จบแล้ว มาจุ้บอายด้วยย อิอิ 😘</p>
<p> </p>
<script>
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 6000);
  }

  setInterval(createHeart, 250);
</script>
