<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>💖</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      padding-top: 100px;
      margin: 0;
      position: relative;
      z-index: 1;

      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    /* 🌫 พื้นหลังรูป + เฟด */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: linear-gradient(
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.2)
      ), url('BG2.jpg') no-repeat center center;

      background-size: cover;
      opacity: 0.3; /* 👈 ปรับความจางตรงนี้ */
      z-index: -1;
    }

    h1 {
      font-size: 60px;
      animation: pop 0.6s ease;
    }

    p {
      font-size: 20px;
      margin-bottom: 20px;
    }

    video {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<h1>💖</h1>
<p>ขอบคุณสำหรับทุกๆอย่างนะเธอ :)</p>

<video width="500" autoplay muted controls>
  <source src="eyefluke.mp4" type="video/mp4">
</video>

</body>
</html>
